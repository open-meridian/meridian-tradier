# The e2e's reader (e2e/reader.py) and, from 0.6.0, the desk the order path
# places from (e2e/desk.py), each run from the plugin's own image with this
# directory mounted: the harness's plugins.yaml makes their services, and
# this gives each its command. Paths are absolute (the harness's README).
services:
  reader:
    entrypoint: ["python", "-u", "/e2e/reader.py"]
    volumes:
      - ${TRADIER_E2E:?set TRADIER_E2E to this repository's e2e directory, absolute}:/e2e:ro
  desk:
    entrypoint: ["python", "-u", "/e2e/desk.py"]
    read_only: true
    volumes:
      - ${TRADIER_E2E:?set TRADIER_E2E to this repository's e2e directory, absolute}:/e2e:ro
